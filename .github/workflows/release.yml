name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  APP_NAME: are-you-healthy
  RELEASE_VERSION: ${{ github.ref_name }}

jobs:
  build-linux-binary:
    name: Build Linux Binary (x86_64-unknown-linux-musl)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust_web_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools zip

      - name: Build release binary
        run: cargo build --release --target x86_64-unknown-linux-musl

      - name: Package Linux release
        run: |
          mkdir -p package
          cp "target/x86_64-unknown-linux-musl/release/rust_web_app" "package/${APP_NAME}"
          chmod +x "package/${APP_NAME}"
          cp config.toml.example package/config.toml
          cp -r assets package/
          mkdir -p package/data
          zip -rq "${APP_NAME}-linux-x86_64-${RELEASE_VERSION}.zip" package/

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: are-you-healthy-linux-x86_64
          path: rust_web_app/are-you-healthy-linux-x86_64-${{ env.RELEASE_VERSION }}.zip
          retention-days: 30

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-linux-binary]
    steps:
      - name: Download Linux binary
        uses: actions/download-artifact@v4
        with:
          name: are-you-healthy-linux-x86_64
          path: release/

      - name: Verify release assets
        run: ls -lah release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/are-you-healthy-linux-x86_64-${{ env.RELEASE_VERSION }}.zip
          generate_release_notes: true
