<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Are You Healthy — 健康检查</title>
  <link rel="stylesheet" href="/app.css" />
</head>
<body>
  <header class="header">
    <h1>Are You Healthy</h1>
    <p>配置 HTTP 健康检查，异常时通过飞书或 PushPlus 推送告警</p>
  </header>

  <main class="layout">
    <section class="card">
      <h2>告警通道测试</h2>
      <p class="hint">
        使用 <code>config.toml</code> 中已启用的飞书 / PushPlus 配置发送测试消息（修改配置后需重启服务）。
      </p>
      <div class="form-actions">
        <button type="button" id="feishu-test" class="btn">飞书测试消息</button>
        <button type="button" id="pushplus-test" class="btn">PushPlus 测试消息</button>
      </div>
    </section>

    <section class="card">
      <div class="card-head">
        <h2>检查条目</h2>
        <button type="button" id="btn-refresh" class="btn">刷新状态</button>
      </div>

      <p class="hint" id="check-form-hint">填写下方表单添加新的健康检查。</p>
      <form id="check-form" class="form-grid">
        <label>
          名称
          <input type="text" id="check-name" required placeholder="例如：官网 API" />
        </label>
        <label>
          URL
          <input type="url" id="check-url" required placeholder="https://example.com/health" />
        </label>
        <label>
          方法
          <select id="check-method">
            <option value="GET">GET</option>
            <option value="HEAD">HEAD</option>
            <option value="POST">POST</option>
          </select>
        </label>
        <label>
          期望状态码
          <input type="number" id="check-status" value="200" min="100" max="599" />
        </label>
        <label>
          检查间隔（秒）
          <input type="number" id="check-interval" value="60" min="10" />
        </label>
        <label class="checkbox">
          <input type="checkbox" id="check-enabled" checked />
          启用
        </label>
      </form>

      <div class="checkpoint-editor">
        <div class="card-head checkpoint-head">
          <h3>检查点（响应体）</h3>
          <button type="button" id="checkpoint-add" class="btn">添加检查点</button>
        </div>
        <p class="hint">状态码符合预期后，按顺序校验响应体；全部通过才视为正常。</p>
        <table class="table" id="checkpoint-table">
          <thead>
            <tr>
              <th>类型</th>
              <th>预期值</th>
              <th>启用</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="checkpoint-body"></tbody>
        </table>
      </div>

      <div class="form-actions check-form-actions">
        <button type="submit" form="check-form" class="btn primary" id="check-submit">添加检查</button>
        <button type="button" class="btn" id="check-cancel-edit" hidden>取消编辑</button>
      </div>

      <table class="table" id="checks-table">
        <thead>
          <tr>
            <th>名称</th>
            <th>URL</th>
            <th>状态</th>
            <th>延迟</th>
            <th>上次检查</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="checks-body"></tbody>
      </table>
    </section>

    <section class="card" id="history-panel" hidden>
      <div class="card-head">
        <h2 id="history-title">检测历史</h2>
        <button type="button" id="history-close" class="btn">关闭</button>
      </div>
      <p class="hint" id="history-meta"></p>
      <table class="table">
        <thead>
          <tr>
            <th>时间</th>
            <th>状态</th>
            <th>延迟</th>
            <th>说明</th>
          </tr>
        </thead>
        <tbody id="history-body"></tbody>
      </table>
      <div class="form-actions history-actions">
        <button type="button" id="history-more" class="btn" hidden>加载更多</button>
      </div>
    </section>
  </main>

  <div id="toast" class="toast" hidden></div>
  <script src="/app.js?v=5"></script>
</body>
</html>
